<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستر آرکید</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="register"><div class="box"><div class="logo">🎮</div><h1>مستر آرکید</h1><p>برای ورود به بازی‌ها اسم موردنظر خود را وارد کنید</p><input id="name" maxlength="18" placeholder="نام بازیکن"><button id="enter">🚀 ورود به بازی</button><div id="err"></div></div></div>
<div class="app" id="app"><div class="wrap"><div style="text-align:center;color:#8fb4ff;font-weight:900;font-size:14px;margin:2px 0 10px">سازنده: صدرا حاتمی</div>
<header><div class="brand">🎮 مستر آرکید</div><div class="profile">👤 <span id="player"></span></div></header>
<h2>🎮 انتخاب بازی</h2>
<div class="games">
<div class="card" data-game="chess"><div class="icon">♟️</div><b>شطرنج</b><small>دو نفره</small></div>
<div class="card" data-game="ttt"><div class="icon">⭕❌</div><b>دوز</b><small>دو نفره</small></div>
<div class="card" data-game="ludo"><div class="icon">🎲</div><b>منچ</b><small>چهار مهره</small></div>
<div class="card" data-game="memory"><div class="icon">🧠</div><b>حافظه</b><small>پیدا کردن جفت‌ها</small></div>
<div class="card" data-game="math"><div class="icon">🧮</div><b>چالش ریاضی</b><small>رکوردی</small></div>
<div class="card" data-game="snake"><div class="icon">🐍</div><b>مار</b><small>کلاسیک</small></div><div class="card" data-game="truth"><div class="icon">🥺</div><b>جرئت یا حقیقت</b><small>۸۰ پرسش</small></div>
</div>
<section id="gameArea"><button class="back" id="back">← بازگشت</button><h2 id="gameTitle"></h2><div id="gameContent"></div></section>
</div></div>
<script src="js/main.js"></script>

</body></html>
